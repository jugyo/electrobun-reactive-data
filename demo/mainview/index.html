<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reactive Todos</title>
    <script>
      window.__erdBootErrors = [];
      addEventListener("error", (e) =>
        window.__erdBootErrors.push(String(e.error || e.message)),
      );
      addEventListener("unhandledrejection", (e) =>
        window.__erdBootErrors.push(String(e.reason)),
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
