name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci --ignore-scripts
      - run: npm run prepare:native
      - run: npm run format:check
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm pack --pack-destination examples/notes-consumer/vendor
      - run: npm install ./vendor/jugyo-electrobun-reactive-data-0.0.0-poc.tgz --ignore-scripts
        working-directory: examples/notes-consumer
      - run: npm run prepare:native && npm run build
        working-directory: examples/notes-consumer
      - run: git diff --check
